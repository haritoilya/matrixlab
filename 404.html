<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Страница не найдена · Page not found — Matrix Lab</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/2e58e154-4315-4a29-b908-76e4a7621996-3541648.png">
<style>
  :root { --ink: #111; --muted: #5b6770; --brand: #0a6f80; --bg: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 32px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 "Open Sans", Arial, sans-serif; text-align: center; }
  img { width: 180px; height: auto; margin-bottom: 32px; }
  .code { font-size: 72px; line-height: 1; font-weight: 300; color: var(--brand); margin: 0 0 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 4px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
  a.btn { display: inline-block; padding: 12px 22px; border: 1px solid var(--brand); border-radius: 999px; color: var(--brand); text-decoration: none; font-weight: 600; }
  a.btn:hover { background: var(--brand); color: #fff; }
</style>
</head>
<body>
  <a href="/"><img src="/assets/img/fc493bfc-c8cc-48fe-84dd-252bdcdd58af-3541324.png" alt="Matrix Lab"></a>
